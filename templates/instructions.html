<!DOCTYPE html>
<html lang="{{ current_language|default('en') }}">
<head>
    <meta charset="UTF-8">
    <title>{{ translations.instructions.title | default('Instructions') }}</title>
    <link rel="stylesheet" href="{{ static_url('css/style.css') }}">
</head>
<body data-page="instructions" data-static-prefix="{{ static_prefix }}">
<div class="instruction-container">
    <div class="language-switcher">
        <select id="language-switcher">
            <option value="ar">العربية</option>
            <option value="bn">বাংলা</option>
            <option value="zh">中文</option>
            <option value="en">English</option>
            <option value="fr">Français</option>
            <option value="de">Deutsch</option>
            <option value="hi">हिन्दी</option>
            <option value="ja">日本語</option>
            <option value="ru">Русский</option>
            <option value="es">Español</option>
            <option value="ur">اردو</option>
        </select>
    </div>

    <p id="instructions-line">{{ translations.instructions.title | default('Thank you very much but the survey is not yet completed, we would like to ask you a few more general questions.') }}</p>
    <form method="post">
        <button type="submit" class="submit-btn">{{ translations.instructions.continue_button | default('Continue') }}</button>
    </form>
</div>


    <script src="{{ static_url('js/language.js') }}"></script>
</body>
</html>
