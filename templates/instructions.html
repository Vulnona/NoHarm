<!DOCTYPE html>
<html lang="{{ current_language|default('en') }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ translations.instructions.title | default('Instructions') }}</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ asset_url('css/style.css') }}">
    <style>
        body[data-page="instructions"] {
            display: flex !important;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 0;
            background-color: #f9f9f9;
        }

        body[data-page="instructions"] .intro-container {
            position: relative;
            padding-top: 84px;
        }

        body[data-page="instructions"] .intro-toolbar {
            position: absolute;
            top: 12px;
            inset-inline-end: 12px;
            left: auto;
            bottom: auto;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 0.6rem;
            transform: none;
            z-index: 12;
            width: auto;
            min-height: 48px;
        }

        body[data-page="instructions"] .intro-toolbar > * {
            height: 48px;
            min-height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
        }

        body[data-page="instructions"] .language-switcher {
            position: relative !important;
            width: auto;
            min-width: var(--lang-switcher-min-width);
            height: var(--lang-switcher-height);
            min-height: var(--lang-switcher-height);
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #007bff;
            border-radius: 999px;
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.2);
        }

        body[data-page="instructions"] .language-switcher:hover {
            transform: scale(1.03);
        }

        body[data-page="instructions"] .instructions-actions {
            margin-top: 1.75rem;
            display: flex;
            justify-content: center;
        }

        @media (max-width: 768px) {
            body[data-page="instructions"] {
                padding: 20px 16px 28px;
            }

            body[data-page="instructions"] .intro-toolbar {
                top: 14px;
                inset-inline-start: auto;
                inset-inline-end: 16px;
                width: auto;
                justify-content: flex-end;
                align-items: center;
                gap: 0.75rem;
                flex-direction: row;
            }

            body[data-page="instructions"] .language-switcher {
                order: 2;
                flex: 0 0 auto;
                min-width: 136px;
                height: 42px;
                min-height: 42px;
                padding: 0 0.7rem;
            }

            body[data-page="instructions"] .language-switcher select {
                font-size: 0.95rem;
                padding-inline-start: 0.7rem;
                padding-inline-end: 1.55rem;
            }

            body[data-page="instructions"] .intro-toolbar > * {
                height: 42px;
                min-height: 42px;
            }
        }
    </style>
</head>
<body data-page="instructions" data-assets-prefix="{{ assets_prefix }}">
<div class="intro-container">
    <div class="intro-toolbar">
        <div class="language-switcher">
            <select id="language-switcher" aria-label="Select language">
                <option value="ar">العربية</option>
                <option value="bn">বাংলা</option>
                <option value="zh">中文</option>
                <option value="en">English</option>
                <option value="fr">Français</option>
                <option value="de">Deutsch</option>
                <option value="hi">हिन्दी</option>
                <option value="ja">日本語</option>
                <option value="ru">Русский</option>
                <option value="es">Español</option>
                <option value="ur">اردو</option>
            </select>
        </div>
    </div>

    <h2 id="intro-title">{{ translations.instructions.title | default('Thank you very much! In the following we would like to ask you a few more general questions.') }}</h2>

    <div class="instructions-actions">
        <form method="post" action="/instructions">
            <button type="submit" class="submit-btn">{{ translations.instructions.continue_button | default('Continue') }}</button>
        </form>
    </div>
</div>


    <script src="{{ asset_url('js/language.js') }}"></script>
</body>
</html>
