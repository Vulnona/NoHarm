
<!DOCTYPE html>
<html lang="{{ current_language|default('en') }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ translations.no_consent.no_consent_title | default('Survey Declined') }}</title>
    <link rel="stylesheet" href="{{ asset_url('css/style.css') }}">
</head>
<body data-page="no_consent" data-assets-prefix="{{ assets_prefix }}">

<!-- Language switcher in the corner -->



    <div class="thank-you-container">
        <div class="language-switcher">
            <select id="language-switcher">
                <option value="ar">العربية</option>
                <option value="bn">বাংলা</option>
                <option value="zh">中文</option>
                <option value="en">English</option>
                <option value="fr">Français</option>
                <option value="de">Deutsch</option>
                <option value="hi">हिन्दी</option>
                <option value="ja">日本語</option>
                <option value="ru">Русский</option>
                <option value="es">Español</option>
                <option value="ur">اردو</option>
            </select>
        </div>

        <h1 id="no-consent-title">{{ translations.no_consent.no_consent_title | default('Thank you for your time!') }}</h1>
        <p id="no-consent-message">{{ translations.no_consent.no_consent_message | default('Since you did not consent to participate in the survey, your responses were not recorded. We appreciate your time.') }}</p>
    </div>

    <script src="{{ asset_url('js/language.js') }}"></script>
</body>
</html>
