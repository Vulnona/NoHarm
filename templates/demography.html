<!DOCTYPE html>
<html lang="{{ current_language|default('en') }}">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ translations.demography.title | default('Demographic Questions') }}</title>
    <link rel="stylesheet" href="{{ asset_url('css/style.css') }}">
    <style>
        .error-message {
            color: red;
            margin-top: 5px;
            font-size: 0.9em;
        }
    </style>
</head>

<body data-page="demography" data-assets-prefix="{{ assets_prefix }}">

    <div class="demography-container">
        <!-- Language Switcher -->
        <div class="language-switcher">
            <select id="language-switcher">
                <option value="ar">العربية</option>
                <option value="bn">বাংলা</option>
                <option value="zh">中文</option>
                <option value="en">English</option>
                <option value="fr">Français</option>
                <option value="de">Deutsch</option>
                <option value="hi">हिन्दी</option>
                <option value="ja">日本語</option>
                <option value="ru">Русский</option>
                <option value="es">Español</option>
                <option value="ur">اردو</option>
            </select>
        </div>

        <!-- Main Form -->
        <form method="POST" action="/demography" id="demography-form" novalidate>
            <input type="hidden" name="question_id" value="{{ question.id }}">
            <input type="hidden" name="current_index" value="{{ index }}">

            <div class="question-block">
                <label>{{ question.label }}</label>

                {% if question.type == "radio" %}
                {% for option in question.options %}
                <div class="radio-container">
                    <input type="radio" name="answer" id="{{ option.value }}" value="{{ option.value }}">
                    <label for="{{ option.value }}">{{ option.label }}</label>
                </div>
                {% endfor %}

                {% elif question.type == "text" %}
                <input type="text" name="answer" placeholder="{{ question.placeholder }}">

                {% elif question.type == "number" %}
                {% if question.id == "age" %}
                <div class="form-group">
                    <input type="number" name="answer" id="age-input" placeholder="Enter your age" min="16" max="120" step="1" inputmode="numeric" pattern="\\d*" autocomplete="off">
                    <div id="age-error-msg" class="error-message" style="color:red; display:none;"></div>
                    <button type="button" id="age-next-btn" class="btn" style="margin-top:12px;" disabled>
                        {{ translations.demography.next | default('Next') }}
                    </button>
                </div>
                {% else %}
                <input type="number" name="answer" class="number-input" id="{{ question.id }}"
                    placeholder="{{ question.placeholder }}">
                {% endif %}
                {% endif %}
            </div>

        </form>

        <div class="progress-container progress-container--bottom">
            <div class="progress-bar" id="progress-bar"></div>
        </div>
    </div>

    <script src="{{ asset_url('js/language.js') }}"></script>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const form = document.getElementById("demography-form");
            const ageInput = document.getElementById("age-input");
            const ageNextBtn = document.getElementById("age-next-btn");
            const questionIdField = form ? form.querySelector("input[name='question_id']") : null;
            const questionId = questionIdField ? questionIdField.value : null;

            if (!form) return;

            function showError(message) {
                if (!ageInput) return;
                let errorMsg = document.getElementById("age-error-msg");
                if (!errorMsg) {
                    errorMsg = document.createElement("div");
                    errorMsg.id = "age-error-msg";
                    errorMsg.style.color = "red";
                    errorMsg.style.fontWeight = "bold";
                    errorMsg.style.marginTop = "5px";
                    ageInput.parentNode.insertBefore(errorMsg, ageInput.nextSibling);
                }
                if (window.__i18n?.ageInvalid) {
                    errorMsg.dataset.errorText = window.__i18n.ageInvalid;
                }
                errorMsg.textContent = message;
                errorMsg.style.display = "block";
            }

            function clearError() {
                const errorMsg = document.getElementById("age-error-msg");
                if (errorMsg) {
                    errorMsg.textContent = "";
                    errorMsg.style.display = "none";
                }
            }

            if (ageInput && questionId) {
                const savedAge = localStorage.getItem('demography_' + questionId);
                if (savedAge !== null) {
                    ageInput.value = savedAge;
                } else if (ageInput.value) {
                    localStorage.setItem('demography_' + questionId, ageInput.value);
                }
            }

            if (ageInput) {
                form.addEventListener("submit", function (event) {
                    const age = parseInt(ageInput.value, 10);
                    if (isNaN(age) || age < 16 || age > 120) {
                        event.preventDefault();
                        const langErrorMsg = window.__i18n?.ageInvalid || "⚠️ Invalid age. Please enter a value between 16 and 120.";
                        showError(langErrorMsg);
                        ageInput.focus();
                        return;
                    }
                    clearError();
                    if (questionId) {
                        localStorage.setItem('demography_' + questionId, ageInput.value);
                    }
                });

                function toggleAgeNext() {
                    const age = parseInt(ageInput.value, 10);
                    const valid = !isNaN(age) && age >= 16 && age <= 120;
                    if (ageNextBtn) {
                        ageNextBtn.disabled = !valid;
                    }
                    return valid;
                }

                // initialize state based on any prefilled value
                toggleAgeNext();

                if (ageNextBtn) {
                    ageNextBtn.addEventListener('click', (e) => {
                        e.preventDefault();
                        if (toggleAgeNext()) {
                            form.submit();
                        }
                    });
                }

                ageInput.addEventListener('keydown', function (event) {
                    if (event.key === 'Enter') {
                        event.preventDefault();
                    }
                });

                ageInput.addEventListener('wheel', function (event) {
                    event.preventDefault();
                }, { passive: false });

                ageInput.addEventListener("input", function () {
                    const age = parseInt(ageInput.value, 10);
                    if (ageInput.value === "") {
                        clearError();
                    } else if (!isNaN(age) && age >= 16 && age <= 120) {
                        clearError();
                    } else {
                        const langErrorMsg = window.__i18n?.ageInvalid || "⚠️ Invalid age. Please enter a value between 16 and 120.";
                        showError(langErrorMsg);
                    }
                    toggleAgeNext();
                    if (questionId) {
                        localStorage.setItem('demography_' + questionId, ageInput.value);
                    }
                });
            }
        });
    </script>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const form = document.getElementById("demography-form");
            // Disable Previous on the very first question
            const currentIndex = parseInt(form.querySelector("input[name='current_index']").value, 10);
            const questionId = form.querySelector("input[name='question_id']").value;
            const radios = form.querySelectorAll("input[type=radio][name='answer']");
            const textInput = form.querySelector("input[type=text][name='answer']");
            const ageField = document.getElementById("age-input");
            const otherNumberInput = !ageField ? form.querySelector("input[type=number][name='answer']") : null;
            const urlParams = new URLSearchParams(window.location.search);
            const prefillParam = urlParams.get('prefill');

            if (!Number.isNaN(currentIndex)) {
                localStorage.setItem('demography_index_' + currentIndex, questionId);
            }

            if (prefillParam !== null) {
                localStorage.setItem('demography_' + questionId, prefillParam);
            }

            const savedAnswer = prefillParam !== null
                ? prefillParam
                : localStorage.getItem('demography_' + questionId);
            // if no more questions, go to next page
            function goToNext() {
                const nextIndex = currentIndex + 1;
                const demographyUrl = new URL('/demography', window.location.origin);
                demographyUrl.searchParams.set('index', nextIndex);
                window.location.href = demographyUrl.toString();
            }

            if (savedAnswer !== null) {
                if (radios.length > 0) {
                    radios.forEach(r => {
                        if (r.value === savedAnswer) {
                            r.checked = true;
                        }
                    });
                } else if (textInput) {
                    textInput.value = savedAnswer;
                } else if (!ageField && otherNumberInput) {
                    otherNumberInput.value = savedAnswer;
                }
            } else {
                if (radios.length > 0) {
                    const checked = Array.from(radios).find(r => r.checked);
                    if (checked) {
                        localStorage.setItem('demography_' + questionId, checked.value);
                    }
                } else if (textInput && textInput.value.trim().length > 0) {
                    localStorage.setItem('demography_' + questionId, textInput.value);
                } else if (!ageField && otherNumberInput && otherNumberInput.value.trim().length > 0) {
                    localStorage.setItem('demography_' + questionId, otherNumberInput.value);
                }
            }

            function goToNext() {
                const nextIndex = currentIndex + 1;
                const demographyUrl = new URL('/demography', window.location.origin);
                demographyUrl.searchParams.set('index', nextIndex);
                window.location.href = demographyUrl.toString();
            }

            // Auto-advance on selection/entry
            if (radios.length > 0) {
                radios.forEach(r => {
                    r.addEventListener("change", () => {
                        localStorage.setItem('demography_' + questionId, r.value);
                        goToNext();
                    });
                });
            }

            if (textInput) {
                textInput.addEventListener("input", () => {
                    localStorage.setItem('demography_' + questionId, textInput.value);
                });
                textInput.addEventListener("change", () => {
                    if (textInput.value.trim().length > 0) {
                        goToNext();
                    }
                });
            }

            if (otherNumberInput) {
                otherNumberInput.addEventListener("input", () => {
                    localStorage.setItem('demography_' + questionId, otherNumberInput.value);
                });
                otherNumberInput.addEventListener("change", () => {
                    if (otherNumberInput.value.trim().length > 0) {
                        goToNext();
                    }
                });
            }

        });
    </script>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const progressBar = document.getElementById("progress-bar");

            // Map pages to steps
            const steps = {
                "choice_experiment": 1,
                "procedural_ratings": 2,
                "demography": 3,
                "group_preferences": 4
            };

            const currentPage = document.body.getAttribute("data-page");
            const totalSteps = 4;

            if (steps[currentPage]) {
                const percent = (steps[currentPage] / totalSteps) * 100;
                progressBar.style.width = percent + "%";
            }
        });
    </script>


</body>

</html>
