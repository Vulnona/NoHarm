<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demographic Questions</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body data-page="demography">

    <div class="demography-container">

        <!-- Language Switcher -->
        <div class="language-switcher">
            <select id="language-switcher">
                <option value="ar">العربية</option>
                <option value="bn">বাংলা</option>
                <option value="zh">中文</option>
                <option value="en">English</option>
                <option value="fr">Français</option>
                <option value="de">Deutsch</option>
                <option value="hi">हिन्दी</option>
                <option value="ja">日本語</option>
                <option value="ru">Русский</option>
                <option value="es">Español</option>
                <option value="ur">اردو</option>
            </select>
        </div>

        <!-- Page Title -->
        <h2 class="demography-title">Demographic Questions</h2>

        <form method="POST" action="/demography" id="demography-form">
            <input type="hidden" name="question_id" value="{{ question.id }}">
            <input type="hidden" name="current_index" value="{{ index }}">

            <div class="question-block">
                <label class="question-label">{{ question.label }}</label>

                {% if question.type == "radio" %}
                    <div class="radio-group">
                        {% for option in question.options %}
                            <label class="custom-radio">
                                <input type="radio" name="answer" id="{{ option.value }}" value="{{ option.value }}" onchange="this.form.submit()">
                                <span class="radio-mark"></span>
                                {{ option.label }}
                            </label>
                        {% endfor %}
                    </div>

                {% elif question.type == "text" %}
                    <input type="text" name="answer" class="text-input" placeholder="{{ question.placeholder }}" onchange="this.form.submit()">

                {% elif question.type == "number" %}
                    <input type="number" name="answer" class="number-input" id="age-input" placeholder="{{ question.placeholder }}" min="16" max="120" onchange="this.form.submit()">
                {% endif %}
            </div>
        </form>
    </div>

    <script src="{{ url_for('static', filename='js/language.js') }}"></script>
</body>
</html>
